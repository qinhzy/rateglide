name: Extension checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:i18n
        env:
          RATEGLIDE_QA_DIR: ${{ runner.temp }}/rateglide-qa
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rateglide-build-and-checks
          path: |
            release/rateglide-*.zip
            ${{ runner.temp }}/rateglide-qa
